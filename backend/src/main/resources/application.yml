server:
  port: 8080

spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:./backend/.env.local[.properties]

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  chat-path: ${DEEPSEEK_CHAT_PATH:/chat/completions}
