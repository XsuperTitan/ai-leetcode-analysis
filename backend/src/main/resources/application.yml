server:
  port: 8080

spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:./backend/.env.local[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_coding_analysis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: always

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  chat-path: ${DEEPSEEK_CHAT_PATH:/chat/completions}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
