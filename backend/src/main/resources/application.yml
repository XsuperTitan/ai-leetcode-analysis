server:
  port: 8080

spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:./backend/.env.local[.properties]
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_coding_analysis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: always

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  chat-path: ${DEEPSEEK_CHAT_PATH:/chat/completions}

asr:
  default-provider: ${ASR_DEFAULT_PROVIDER:auto}
  whisper:
    base-url: ${ASR_WHISPER_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
    api-key: ${ASR_WHISPER_API_KEY:${OPENAI_API_KEY:}}
    model: ${ASR_WHISPER_MODEL:${OPENAI_TRANSCRIPTION_MODEL:whisper-1}}
    transcription-path: ${ASR_WHISPER_TRANSCRIPTION_PATH:/audio/transcriptions}
  challenger:
    base-url: ${ASR_CHALLENGER_BASE_URL:${STEPFUN_BASE_URL:https://api.stepfun.com/v1}}
    api-key: ${ASR_CHALLENGER_API_KEY:${STEPFUN_API_KEY:}}
    model: ${ASR_CHALLENGER_MODEL:${STEPFUN_ASR_MODEL:step-asr}}
    transcription-path: ${ASR_CHALLENGER_TRANSCRIPTION_PATH:${STEPFUN_TRANSCRIPTION_PATH:/audio/transcriptions}}

app:
  interview-recording:
    max-upload-size-bytes: ${INTERVIEW_RECORDING_MAX_UPLOAD_BYTES:31457280}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
